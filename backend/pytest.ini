[pytest]
# Run from backend/ directory:  pytest
# Configuration:
#   testpaths     — where pytest looks for tests
#   pythonpath    — adds backend/ to sys.path so `from app...` works
#   asyncio_mode  — auto-detect async tests (some of our engine helpers are async)
#   addopts       — quieter, fail-fast, show short tracebacks
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -ra --tb=short --strict-markers --disable-warnings

markers =
    slow: tests that exercise a real engine end-to-end on >100 bars
    needs_live: tests that need Angel One to be authenticated (skipped in CI)
