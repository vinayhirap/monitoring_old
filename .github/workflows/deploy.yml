name: Deploy to EC2

# Triggers:
#   • push to main → deploy to production EC2
#   • workflow_dispatch → manual run from the Actions tab
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST                – the EC2 hostname or IP (e.g. ec2-xx.compute.amazonaws.com)
#   EC2_USER                – SSH username (typically `ubuntu` or `ec2-user`)
#   EC2_SSH_PRIVATE_KEY     – the PEM private key contents that matches the EC2 keypair
#   EC2_APP_DIR             – absolute path to the deployed app on EC2 (e.g. /home/ubuntu/MarketLens)
#
# Optional secrets:
#   SLACK_WEBHOOK_URL       – if set, posts deploy status to Slack
#
# What this workflow does on every push to main:
#   1. Checks out the repo at the pushed commit
#   2. Runs the test suite (smoke tests must pass before deploy)
#   3. rsync's backend/, frontend/, start scripts to EC2
#   4. SSHes in to restart the backend (uvicorn) and rebuild the frontend
#   5. Performs a /api/health probe to verify the deploy worked
#
# This permanently solves the "files don't reach EC2" recurring issue.

on:
  workflow_dispatch: {}

jobs:
  test:
    # Backend tests must pass before we touch production. If a test breaks,
    # the deploy is blocked — no silent broken deploys.
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run pytest
        working-directory: backend
        run: pytest -x --tb=short

  deploy:
    name: rsync + restart
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        # webfactory/ssh-agent loads the secret into the agent for the
        # duration of the job — never written to disk on the runner.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host key to known_hosts
        # Without this, the first ssh would fail interactively asking
        # "is this host genuine?" Use ssh-keyscan to fetch + pin it.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: rsync backend + frontend to EC2
        # --delete removes files on EC2 that were deleted locally — keeps
        # the EC2 tree in sync with main. Excludes runtime artefacts
        # (venv, node_modules, .next build cache, *.db, logs).
        run: |
          rsync -avz --delete \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='.env.local' \
            backend frontend start-backend.sh start-frontend.sh start.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/

      - name: Restart backend + rebuild frontend
        # Heredoc executes a small deploy script ON the EC2 box. Idempotent:
        # if backend service isn't running yet, systemctl start succeeds anyway.
        # Frontend build runs in-place; failure here doesn't kill backend.
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash <<'REMOTE'
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"

            echo "==> Installing backend dependencies"
            cd backend
            python3 -m venv venv 2>/dev/null || true
            source venv/bin/activate
            pip install --quiet -r requirements.txt
            deactivate
            cd ..

            echo "==> Installing frontend dependencies + building"
            cd frontend
            npm ci --silent
            npm run build
            cd ..

            echo "==> Restarting backend service"
            sudo systemctl restart marketlens-backend || {
              echo "systemctl restart failed — falling back to kill + restart"
              pkill -f "uvicorn app.main:app" || true
              sleep 1
              nohup ./start-backend.sh > /tmp/marketlens-backend.log 2>&1 &
            }

            echo "==> Restarting frontend service"
            sudo systemctl restart marketlens-frontend || {
              echo "systemctl restart failed — falling back to kill + restart"
              pkill -f "next start" || true
              sleep 1
              nohup ./start-frontend.sh > /tmp/marketlens-frontend.log 2>&1 &
            }

            echo "==> Deploy complete"
          REMOTE

      - name: Health check
        # Probe /api/health from the runner — if it doesn't return 200
        # within 60 seconds the deploy is considered failed.
        run: |
          for i in {1..30}; do
            if curl -sf "http://${{ secrets.EC2_HOST }}/api/health" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for backend to come up... ($i/30)"
            sleep 2
          done
          echo "Health check FAILED — backend did not respond within 60s"
          exit 1

      - name: Notify Slack on failure
        # Optional — only runs if a SLACK_WEBHOOK_URL secret is set
        # and the prior step failed. Posts a short message.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"❌ MarketLens deploy failed — commit ${{ github.sha }} by ${{ github.actor }}\"}" \
            $SLACK_WEBHOOK_URL
